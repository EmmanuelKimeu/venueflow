<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>VenueFlow - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="brand-container" style="justify-content: center; margin-bottom: 30px;">
            <img src="loGo.png" alt="Egerton Logo" class="uni-logo">
            <div class="logo-text">VenueFlow</div>
        </div>
        <div class="auth-card">
            <h2>Lecturer Login</h2>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Sign in to your portal</p>
            <form onsubmit="handleAuth(event, 'login')">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" placeholder="lecturer@egerton.ac.ke" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="auth-btn">Sign In</button>
            </form>
            <p class="toggle-text">New? <a href="registration.html">Register here</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
