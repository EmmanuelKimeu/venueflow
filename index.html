<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VenueFlow - Lecturer Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar">
        <div class="brand-container">
            <img src="loGo.jpg" alt="Egerton Logo" class="uni-logo">
            <div class="logo-text">VenueFlow</div>
        </div>
        
        <nav class="side-nav">
            <button class="nav-item active tab-btn" onclick="showSection('timetable')">
                <i class="fas fa-th-large"></i> Dashboard
            </button>
            <button class="nav-item tab-btn" onclick="showSection('create')">
                <i class="fas fa-calendar-plus"></i> Schedule Lecture
            </button>
        </nav>
        
        <div style="font-size: 11px; color: #94a3b8; text-align: left; margin-top: auto;">
            Egerton University
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="header-top">
            <div>
                <h1>Dashboard Overview</h1>
                <p style="color: #64748b; font-size: 14px;"> Hello welcome back.</p>
            </div>
            <div class="user-profile">
                <span>Lecturer:</span>
                <!-- EDITABLE NAME INPUT IN HEADER -->
                <input type="text" id="headerNameInput" class="name-edit-input" placeholder="Enter Your Name" oninput="syncName(this.value)">
                <div class="avatar-circle"><i class="fas fa-user-tie"></i></div>
            </div>
        </header>

        <!-- STATS ROW -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon blue-icon"><i class="fas fa-book"></i></div>
                <div class="stat-info">
                    <span>Active Bookings</span>
                    <h3 id="bookingCount">0</h3>
                </div>
            </div>
        </div>

        <!-- CREATE NEW SCHEDULE SECTION -->
        <section id="create-section" class="dashboard-section hidden">
            <div class="card">
                <div class="card-header"><h2>Create New Schedule</h2></div>
                <form id="scheduleForm" class="form-container">
                    <div class="input-group">
                        <label>Course Name</label>
                        <select id="courseInput">
                            <option>COMP 334 - Artificial Intelligence</option>
                            <option>COMP 341 - Web Design & Development</option>
                            <option>ACMP 340 - Digital Image Processing</option>
                            <option>COMP 361 - Software Engineering (II)</option>
                            <option>COMP 351 - Database systems</option>
                            <option>COMP 340 - Computer Graphics & Visualization</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Lecturer Name</label>
                    
                        <input type="text" id="lecturerInput" placeholder="e.g. Victor Munene" class="form-name-input" oninput="syncName(this.value)">
                    </div>
                    <div class="input-group">
                        <label>Hall / Room</label>
                        <select id="roomInput">
                            <option>PST1</option><option>PST2</option><option>PST3</option>
                            <option>PST4</option><option>PST5</option><option>Software Lab</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Day of Week</label>
                        <select id="dayInput">
                            <option value="MON">Monday</option><option value="TUE">Tuesday</option>
                            <option value="WED">Wednesday</option><option value="THU">Thursday</option>
                            <option value="FRI">Friday</option>
                        </select>
                    </div>
                    <div class="input-group" style="grid-column: span 2;">
                        <label>Select Time Slot</label>
                        <select id="timeInput">
                            <option value="1">7.00am-8.00am</option><option value="2">8.00am-9.00am</option>
                            <option value="3">9.00am-10.00am</option><option value="4">10.00am-11.00am</option>
                            <option value="5">11.00am-12.00pm</option><option value="6">12.00pm-1.00pm</option>
                            <option value="7">1.00pm-2.00pm</option>
                        </select>
                    </div>
                    <button type="button" class="submit-btn" onclick="saveSchedule()">Confirm & Save Booking</button>
                </form>
            </div>
        </section>

        <!-- TIMETABLE SECTION -->
        <section id="timetable-section" class="dashboard-section">
            <div class="card">
                <div class="card-header"><h2>Weekly Schedule</h2></div>
                <table class="timetable">
                    <thead>
                        <tr>
                            <th>Time</th><th>Monday</th><th>Tuesday</th><th>Wednesday</th><th>Thursday</th><th>Friday</th>
                        </tr>
                    </thead>
                    <tbody id="timetableBody">
                        <tr><td class="day-label">07:00-08:00</td><td id="MON-1"></td><td id="TUE-1"></td><td id="WED-1"></td><td id="THU-1"></td><td id="FRI-1"></td></tr>
                        <tr><td class="day-label">08:00-09:00</td><td id="MON-2"></td><td id="TUE-2"></td><td id="WED-2"></td><td id="THU-2"></td><td id="FRI-2"></td></tr>
                        <tr><td class="day-label">09:00-10:00</td><td id="MON-3"></td><td id="TUE-3"></td><td id="WED-3"></td><td id="THU-3"></td><td id="FRI-3"></td></tr>
                        <tr><td class="day-label">10:00-11:00</td><td id="MON-4"></td><td id="TUE-4"></td><td id="WED-4"></td><td id="THU-4"></td><td id="FRI-4"></td></tr>
                        <tr><td class="day-label">11:00-12:00</td><td id="MON-5"></td><td id="TUE-5"></td><td id="WED-5"></td><td id="THU-5"></td><td id="FRI-5"></td></tr>
                        <tr><td class="day-label">12:00-1:00</td><td id="MON-6"></td><td id="TUE-6"></td><td id="WED-6"></td><td id="THU-6"></td><td id="FRI-6"></td></tr>
                        <tr><td class="day-label">1:00-2:00</td><td id="MON-7"></td><td id="TUE-7"></td><td id="WED-7"></td><td id="THU-7"></td><td id="FRI-7"></td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
